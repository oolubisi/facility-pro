<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Facility Pro Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --card: #1e293b; --card-light: #334155;
      --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8;
      --danger: #ef4444; --success: #22c55e; --border: rgba(255, 255, 255, 0.08);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); width: 100%; overflow-x: hidden; }
    
    /* 1. AUTOFIT LAYOUT */
    .sidebar { display: none !important; }
    .main { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px 16px 100px 16px; min-height: 100vh; }

    /* 2. DASHBOARD 6-BUTTON GRID */
    .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .nav-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 15px;
      text-align: center; aspect-ratio: 1 / 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s;
    }
    .nav-card:active { transform: scale(0.96); background: var(--card-light); }
    .nav-card i { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
    .nav-card .count { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .nav-card small { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; }

    /* 3. SUB-PAGE HEADERS */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .header-group { display: flex; align-items: center; gap: 12px; }
    .home-btn { background: var(--card-light); border: none; color: white; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .add-btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }

    /* 4. MORE... MENU */
    .more-container { position: relative; margin-top: 10px; }
    .more-menu { display: none; position: absolute; bottom: 75px; left: 0; right: 0; background: var(--card-light); border: 1px solid var(--primary); border-radius: 20px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;}
    .more-menu.show { display: block; }
    .menu-item { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--text); font-size: 14px; font-weight: 500; }
    .menu-item i { color: var(--primary); width: 20px; text-align: center; }

    /* 5. GENERAL COMPONENTS */
    .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
    .action-btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; }
    input, select, textarea { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: white; font-size: 16px !important; }
    
    .page-view { display: none; }
    .active-view { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 5000; padding: 15px; }
    .modal { background: var(--card); width: 100%; max-width: 450px; padding: 25px; border-radius: 24px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="app">
    <main class="main">
      
      <div id="view-dashboard" class="page-view active-view">
        <h2 style="margin-bottom:20px; color:var(--primary); font-weight:800;">Facility Pro</h2>
        
        <div class="nav-grid">
          <div class="nav-card" onclick="showPage('apartments')">
            <i class="fas fa-building"></i>
            <div id="s-tenancy" class="count">--</div>
            <small>Apartments</small>
          </div>
          <div class="nav-card" onclick="showPage('assets')">
            <i class="fas fa-tools"></i>
            <div id="s-asset" class="count">--</div>
            <small>Assets</small>
          </div>
          <div class="nav-card" onclick="showPage('inventory')">
            <i class="fas fa-boxes"></i>
            <div id="s-inv" class="count">--</div>
            <small>Inventory</small>
          </div>
          <div class="nav-card" onclick="showPage('maintenance')">
            <i class="fas fa-clipboard-list"></i>
            <div id="s-maint" class="count">--</div>
            <small>Maintenance</small>
          </div>
          <div class="nav-card" onclick="showPage('utilities')">
            <i class="fas fa-bolt"></i>
            <div id="s-util" class="count">--</div>
            <small>Utilities</small>
          </div>
          <div class="nav-card" onclick="showPage('reports')">
            <i class="fas fa-print"></i>
            <div style="font-size:14px; font-weight:800; margin-top:5px;">VIEW/PRINT</div>
            <small>Reports</small>
          </div>
        </div>

        <div class="more-container">
          <div id="moreMenu" class="more-menu">
            <div class="menu-item" onclick="showPage('staff')"><i class="fas fa-users"></i> Staff Directory</div>
            <div class="menu-item" onclick="showPage('vendors')"><i class="fas fa-truck"></i> Vendors</div>
            <div class="menu-item" onclick="showPage('archived')"><i class="fas fa-archive"></i> Archive Bin</div>
            <div class="menu-item" onclick="showPage('history')"><i class="fas fa-history"></i> System History</div>
          </div>
          <button class="action-btn" style="background:var(--card-light); border:1px solid var(--border)" onclick="toggleMoreMenu(event)">
            <i class="fas fa-ellipsis-h"></i> More...
          </button>
        </div>
      </div>

      <div id="view-apartments" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Units</h2></div>
          <button class="add-btn" onclick="openModal('apartment')">Add</button>
        </div>
        <div id="apt-list"></div>
      </div>

      <div id="view-assets" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Assets</h2></div>
          <button class="add-btn" onclick="openModal('asset')">Add</button>
        </div>
        <div id="asset-list"></div>
      </div>

      <div id="view-inventory" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Inventory</h2></div>
          <button class="add-btn" onclick="openModal('inventory')">Restock</button>
        </div>
        <div id="inventory-list"></div>
      </div>

      <div id="view-maintenance" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Maint.</h2></div>
          <button class="add-btn" onclick="openModal('ticket')">Log</button>
        </div>
        <div id="maint-list"></div>
      </div>

      <div id="view-utilities" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Utilities</h2></div>
          <button class="add-btn" onclick="openModal('utility')">Record</button>
        </div>
        <div id="util-list"></div>
      </div>

      <div id="view-reports" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Reports</h2></div>
        </div>
        <div class="card"><p>Select a category to generate a print-ready report.</p></div>
      </div>

      <div id="view-staff" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Staff</h2></div>
          <button class="add-btn" onclick="openModal('staff')">Add</button>
        </div>
        <div id="staff-list"></div>
      </div>

      <div id="view-vendors" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Vendors</h2></div>
          <button class="add-btn" onclick="openModal('vendor')">Add</button>
        </div>
        <div id="vendor-list"></div>
      </div>

      <div id="view-archived" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>Archive</h2></div>
        </div>
        <div id="archived-list"></div>
      </div>

      <div id="view-history" class="page-view">
        <div class="page-header">
          <div class="header-group"><button class="home-btn" onclick="showPage('dashboard')"><i class="fas fa-home"></i></button><h2>History</h2></div>
        </div>
        <div id="history-list"></div>
      </div>

    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Form</h3>
      <div id="modalBody" style="margin-top:15px;"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="action-btn" style="background:#444" onclick="closeModal()">Cancel</button>
        <button class="action-btn" id="modalSubmit">Save</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz1YFvpd0PW3lsCvBXAV3G-QTVSpmdLblyqCJa-7SrflhNx-VriLARkweaDck3z5BHD/exec"; 
                     
    async function callApi(action, data = {}) {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: action, data: data }),
        });
        return await response.json();
      } catch (err) {
        console.error("API Error:", err);
        return null;
      }
    }
    
    let cache = { apts: [], assets: [], tickets: [] };

    window.onload = () => { refreshDashboardStats(); };

    function toggleMoreMenu(e) { 
      e.stopPropagation(); 
      document.getElementById('moreMenu').classList.toggle('show'); 
    }

    document.addEventListener('click', () => { 
      const menu = document.getElementById('moreMenu');
      if(menu) menu.classList.remove('show'); 
    });

    function showPage(p) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active-view'));
      const menu = document.getElementById('moreMenu');
      if(menu) menu.classList.remove('show');
      
      const target = document.getElementById('view-' + p);
      if (target) { 
        target.classList.add('active-view'); 
        window.scrollTo(0,0); 
      }
      if (p === 'dashboard') refreshDashboardStats(); 
      else refreshData(p);
    }

    async function callApi(action, data = {}) {
      try {
        console.log("SENDING TO GOOGLE:", action, data); // <--- ADD THIS
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: action, data: data }),
        });
        const result = await response.json();
        console.log("RECEIVED FROM GOOGLE:", result); // <--- ADD THIS
        return result;
      } catch (err) {
        console.error("CRITICAL API ERROR:", err);
        return null;
      }
    }

    function refreshData(p) {
      // 1. Map the page name to the actual ID in your HTML
      const idMap = {
        'apartments': 'apt-list',
        'assets': 'asset-list',
        'inventory': 'inventory-list',
        'maintenance': 'maint-list',
        'utilities': 'util-list'
      };

      const listId = idMap[p];
      const listEl = document.getElementById(listId);
      
      if (!listEl) {
        console.error("Could not find HTML element for ID:", listId);
        return;
      }
      
      listEl.innerHTML = '<p style="padding:20px; text-align:center; color:var(--muted)">Loading...</p>';
    
      const actionMap = { 
        'apartments': 'getApartments', 
        'assets': 'getAssets',
        'maintenance': 'getTickets',
        'inventory': 'getInventory'
      };
      
      const action = actionMap[p];
      if (!action) return;

      callApi(action).then(data => {
        if (!data) {
          listEl.innerHTML = '<p style="padding:20px; text-align:center; color:var(--danger)">Connection Error</p>';
          return;
        }

        // --- APARTMENTS ---
        if (p === 'apartments') {
          cache.apts = data || [];
          listEl.innerHTML = cache.apts.map(x => `
            <div class="card" onclick="editApartment('${x.apt}')" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
              <div><strong>${x.apt}</strong><br><small style="color:var(--muted)">${x.tenant || 'Vacant'}</small></div>
              <i class="fas fa-chevron-right" style="opacity:0.3"></i>
            </div>
          `).join('');
        } 
        
        // --- ASSETS ---
        else if (p === 'assets') {
          cache.assets = data || [];
          listEl.innerHTML = cache.assets.map(x => `
            <div class="card" onclick="editAsset('${x.tag}')" style="cursor:pointer;">
              <div style="display:flex; justify-content:space-between; align-items:start;">
                <div>
                   <strong style="color:var(--primary)">${x.tag}</strong>
                   <h4 style="margin:2px 0">${x.type}</h4>
                   <small style="color:var(--muted)">${x.apt} | ${x.loc}</small>
                </div>
                <button style="background:none; border:none; color:var(--danger); padding:5px;" onclick="event.stopPropagation(); archiveAsset('${x.tag}')">
                  <i class="fas fa-archive"></i>
                </button>
              </div>
            </div>
          `).join('');
        }
        
        // --- INVENTORY (As requested) ---
        else if (p === 'inventory') {
          cache.inventory = data || [];
          listEl.innerHTML = cache.inventory.map(x => {
            const isLow = parseInt(x.stock) <= parseInt(x.min);
            return `
              <div class="card" onclick="editInventory('${x.item}')" style="cursor:pointer;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div><strong>${x.item}</strong><br><small>${x.category}</small></div>
                  <div style="text-align:right;">
                    <div style="font-size:20px; font-weight:800; color:${isLow ? 'var(--danger)' : 'var(--success)'}">${x.stock}</div>
                    <small>${x.unit}</small>
                  </div>
                </div>
              </div>`;
          }).join('');
        }
      });
    }
    function refreshDashboardStats() {
      callApi('getStats').then(d => {
        if(!d) return;
        const ids = {'s-tenancy':d.tenancy, 's-asset':d.asset, 's-inv':d.inventory, 's-maint':d.maint, 's-util':d.utilities};
        for(let id in ids) { 
          const el = document.getElementById(id);
          if(el) el.innerText = ids[id] || 0; 
        }
      });
    }

    function openModal(type, editData = null) {
      const body = document.getElementById('modalBody');
      const submit = document.getElementById('modalSubmit');
      const title = document.getElementById('modalTitle');
      const overlay = document.getElementById('modalOverlay');

      const isEdit = !!editData;
      overlay.style.display = 'flex';
      body.innerHTML = ''; 
      submit.disabled = false;
      submit.innerText = isEdit ? "Update" : "Save";

      if (type === 'apartment') {
        title.innerText = isEdit ? "Update Unit" : "Add New Unit";
        body.innerHTML = `<small style="color:var(--muted)">Unit #</small><input id="apt_num" value="${isEdit ? editData.apt : ''}"><small style="color:var(--muted)">Tenant</small><input id="apt_tenant" value="${isEdit ? editData.tenant : ''}">`;
        submit.onclick = () => {
          submit.disabled = true;
          callApi(isEdit ? 'updateApartment' : 'saveApartment', { apt: document.getElementById('apt_num').value, tenant: document.getElementById('apt_tenant').value, oldApt: isEdit ? editData.apt : null }).then(() => { closeModal(); refreshData('apartments'); });
        };
      }
      else if (type === 'ticket') {
        title.innerText = isEdit ? "Update Ticket" : "Log Maintenance";
        const ticketId = isEdit ? editData.id : "TKT-" + Date.now().toString().slice(-6);
        body.innerHTML = `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
            <div><small style="color:var(--muted)">Unit</small><select id="t_apt" onchange="filterAssetsForTicket(this.value)"><option value="">-- Select --</option>${cache.apts.map(a => `<option value="${a.apt}" ${isEdit && a.apt === editData.apt ? 'selected' : ''}>${a.apt}</option>`).join('')}</select></div>
            <div><small style="color:var(--muted)">Asset</small><select id="t_asset"><option value="">General Area</option></select></div>
          </div>
          <input id="t_issue" placeholder="Problem?" value="${isEdit ? editData.issue : ''}">
          <select id="t_priority"><option value="Low" ${isEdit && editData.priority === 'Low' ? 'selected' : ''}>Low</option><option value="Medium" ${isEdit && editData.priority === 'Medium' ? 'selected' : ''}>Medium</option><option value="High" ${isEdit && editData.priority === 'High' ? 'selected' : ''}>High (Urgent)</option></select>
          <textarea id="t_notes" placeholder="Notes" rows="3">${isEdit ? editData.notes : ''}</textarea>
        `;
        if (isEdit || document.getElementById('t_apt').value) filterAssetsForTicket(isEdit ? editData.apt : '', isEdit ? editData.asset : '');
        submit.onclick = () => {
          submit.disabled = true;
          callApi(isEdit ? 'updateTicket' : 'saveTicket', { id: ticketId, apt: document.getElementById('t_apt').value, asset: document.getElementById('t_asset').value, issue: document.getElementById('t_issue').value, priority: document.getElementById('t_priority').value, notes: document.getElementById('t_notes').value, status: isEdit ? editData.status : 'Open' }).then(() => { closeModal(); refreshData('maintenance'); });
        };
      }
        else if (type === 'inventory') {
        title.innerText = isEdit ? "Update Stock" : "New Inventory Item";
        body.innerHTML = `
          <small style="color:var(--muted)">Item Name</small>
          <input id="inv_item" placeholder="e.g. LED Bulb 10W" value="${isEdit ? editData.item : ''}" ${isEdit ? 'disabled' : ''}>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
            <div>
              <small style="color:var(--muted)">Category</small>
              <select id="inv_cat">
                <option value="Electrical" ${isEdit && editData.category === 'Electrical' ? 'selected' : ''}>Electrical</option>
                <option value="Plumbing" ${isEdit && editData.category === 'Plumbing' ? 'selected' : ''}>Plumbing</option>
                <option value="Cleaning" ${isEdit && editData.category === 'Cleaning' ? 'selected' : ''}>Cleaning</option>
                <option value="HVAC" ${isEdit && editData.category === 'HVAC' ? 'selected' : ''}>HVAC</option>
              </select>
            </div>
            <div>
              <small style="color:var(--muted)">Unit</small>
              <input id="inv_unit" placeholder="pcs, boxes, etc." value="${isEdit ? editData.unit : 'pcs'}">
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
            <div>
              <small style="color:var(--muted)">Current Stock</small>
              <input type="number" id="inv_stock" value="${isEdit ? editData.stock : '0'}">
            </div>
            <div>
              <small style="color:var(--muted)">Min. Threshold</small>
              <input type="number" id="inv_min" value="${isEdit ? editData.min : '5'}">
            </div>
          </div>
        `;

        submit.onclick = () => {
          submit.disabled = true;
          const payload = {
            item: document.getElementById('inv_item').value,
            category: document.getElementById('inv_cat').value,
            unit: document.getElementById('inv_unit').value,
            stock: document.getElementById('inv_stock').value,
            min: document.getElementById('inv_min').value
          };
          
          callApi(isEdit ? 'updateInventory' : 'saveInventory', payload).then(() => {
            closeModal();
            refreshData('inventory');
          });
        };
      }
      else if (type === 'asset') {
        title.innerText = isEdit ? "Update Asset" : "Register Asset";
        const uniqueTag = isEdit ? editData.tag : "AST-" + Math.random().toString(36).substr(2, 5).toUpperCase();
        body.innerHTML = `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px;">
            <div><small style="color:var(--muted)">Unit</small><select id="a_apt"><option value="">-- Select --</option>${cache.apts.map(a => `<option value="${a.apt}" ${isEdit && a.apt === editData.apt ? 'selected' : ''}>${a.apt}</option>`).join('')}</select></div>
            <div style="text-align:center;"><small style="color:var(--muted)">Tag</small><br><strong>${uniqueTag}</strong></div>
          </div>
          <input id="a_type" placeholder="Type" value="${isEdit ? editData.type : ''}"><input id="a_loc" placeholder="Location" value="${isEdit ? editData.loc : ''}"><input id="a_status" placeholder="Status" value="${isEdit ? editData.status : 'Operational'}"><textarea id="a_notes" rows="2">${isEdit ? editData.notes : ''}</textarea>
        `;
        submit.onclick = () => {
          submit.disabled = true;
          callApi(isEdit ? 'updateAsset' : 'saveAsset', { apt: document.getElementById('a_apt').value, tag: uniqueTag, type: document.getElementById('a_type').value, loc: document.getElementById('a_loc').value, status: document.getElementById('a_status').value, notes: document.getElementById('a_notes').value }).then(() => { closeModal(); refreshData('assets'); });
        };
      }
    }

    function filterAssetsForTicket(aptNum, selectedAsset = '') {
      const assetSelect = document.getElementById('t_asset');
      if (!assetSelect) return;
      const filtered = cache.assets.filter(a => a.apt === aptNum);
      assetSelect.innerHTML = '<option value="">General Area</option>' + 
        filtered.map(a => `<option value="${a.tag}" ${selectedAsset === a.tag ? 'selected' : ''}>${a.type} (${a.tag})</option>`).join('');
    }
    function editInventory(itemName) {
      const item = cache.inventory.find(i => i.item === itemName);
      if (item) openModal('inventory', item);
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function editApartment(aptNum) { const apt = cache.apts.find(a => a.apt === aptNum); if (apt) openModal('apartment', apt); }
    function editAsset(tag) { const asset = cache.assets.find(a => a.tag === tag); if (asset) openModal('asset', asset); }
    function editTicket(id) { const ticket = cache.tickets.find(t => t.id === id); if (ticket) openModal('ticket', ticket); }
    function archiveAsset(tag) { if(confirm("Archive?")) callApi('archiveAsset', {tag: tag}).then(() => refreshData('assets')); }
  </script>
</body>
</html>
